<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Simulatore per valutare l'acquisto di una casa e confrontarlo con un investimento alternativo.">
<title>Simulatore Acquisto Casa</title>
<link rel="stylesheet" href="./css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="./js/main.js"></script>
</head>
<body>
<main class="container">
<h1>🏠 Simulatore Acquisto Casa</h1>
<div class="dashboard">
<section class="card" aria-label="Parametri della simulazione">
<div class="input-section"><h2 class="section-title">🏠 Immobile</h2>
<div class="input-row"><label for="price">Prezzo immobile (€)</label><input id="price" type="number" min="1" step="1000" value="250000"></div>
<div class="input-row"><label for="down">Anticipo iniziale (€)</label><input id="down" type="number" min="0" step="1000" value="50000"></div>
<div class="input-row"><label for="reno">Ristrutturazione (€)</label><input id="reno" type="number" min="0" step="500" value="10000"></div></div>
<div class="input-section"><h2 class="section-title">🏦 Mutuo</h2>
<div class="input-row"><label for="years">Durata mutuo (anni)</label><input id="years" type="number" min="1" step="1" value="25"></div>
<div class="input-row"><label for="rate">Tasso mutuo annuo (%)</label><input id="rate" type="number" min="0" step="0.01" value="3"></div></div>
<div class="input-section"><h2 class="section-title">💸 Costi acquisto e gestione</h2>
<div class="input-row"><label for="agency">Agenzia immobiliare (%)</label><input id="agency" type="number" min="0" step="0.01" value="3"></div>
<div class="input-row"><label for="notary">Notaio (€)</label><input id="notary" type="number" min="0" step="100" value="3000"></div>
<div class="input-row"><label for="imu">IMU annuale (€)</label><input id="imu" type="number" min="0" step="50" value="0"></div>
<div class="input-row"><label for="condo">Spese condominiali annuali (€)</label><input id="condo" type="number" min="0" step="50" value="1200"></div>
<div class="input-row"><label for="maint">Manutenzione annua (%)</label><input id="maint" type="number" min="0" step="0.01" value="1"></div></div>
<div class="input-section"><h2 class="section-title">📈 Ipotesi finanziarie</h2>
<div class="input-row"><label for="growth">Rivalutazione immobile annua (%)</label><input id="growth" type="number" step="0.01" value="2"></div>
<div class="input-row"><label for="invest">Rendimento investimento (%)</label><input id="invest" type="number" step="0.01" value="5"></div>
<div class="input-row"><label for="infl">Inflazione (%)</label><input id="infl" type="number" step="0.01" value="2"></div>
<div class="input-row"><label for="horizon">Orizzonte simulazione (anni)</label><input id="horizon" type="number" min="1" step="1" value="30"></div></div>
<p id="validation-message" class="validation-message" role="alert" aria-live="polite"></p>
<div class="actions"><button id="calculate-button" type="button">Calcola</button><button id="reset-button" type="button" class="secondary-button">Reset</button><button id="export-button" type="button" class="secondary-button">Esporta CSV</button></div>
</section>
<section class="results-column" aria-label="Risultati della simulazione">
<div class="card"><div id="kpis"></div></div>
<div class="card table-card"><div class="table-scroll"><table id="results"><thead></thead><tbody></tbody></table></div></div>
<div class="card chart-card"><canvas id="c1" aria-label="Confronto tra patrimonio immobiliare e investimento alternativo"></canvas></div>
<div class="card chart-card"><canvas id="c2" aria-label="Valore immobile e debito residuo"></canvas></div>
<div class="card chart-card"><canvas id="c3" aria-label="Costi annuali"></canvas></div>
</section>
</div></main></body></html>
